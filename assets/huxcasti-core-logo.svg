<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
<title id="title">Huxcasti — núcleo planetario</title>
<desc id="desc">Un planeta azul con luz turquesa, emblema H diagonal y la palabra Huxcasti en el centro.</desc>
<defs>
  <radialGradient id="planet" cx="38%" cy="21%" r="91%" fx="30%" fy="13%">
    <stop stop-color="#227cb6"/><stop offset=".18" stop-color="#075080"/>
    <stop offset=".45" stop-color="#082e52"/><stop offset=".68" stop-color="#031326"/><stop offset="1" stop-color="#010714"/>
  </radialGradient>
  <radialGradient id="polar" cx="43%" cy="3%" r="72%">
    <stop stop-color="#8feaff" stop-opacity=".66"/><stop offset=".12" stop-color="#53b8f2" stop-opacity=".24"/><stop offset=".45" stop-color="#0b345e" stop-opacity=".02"/><stop offset="1" stop-color="#000" stop-opacity=".18"/>
  </radialGradient>
  <linearGradient id="globeRim" x1="23%" y1="12%" x2="82%" y2="89%">
    <stop stop-color="#70faff"/><stop offset=".24" stop-color="#10a8ef"/><stop offset=".49" stop-color="#3879d2"/><stop offset=".72" stop-color="#79ebff"/><stop offset="1" stop-color="#0564b9"/>
  </linearGradient>
  <linearGradient id="metalH" x1="0" y1="0" x2=".94" y2="1">
    <stop stop-color="#a8ffff"/><stop offset=".13" stop-color="#15e6f8"/><stop offset=".30" stop-color="#0fa3e8"/><stop offset=".59" stop-color="#00b9f3"/><stop offset=".75" stop-color="#1289d3"/><stop offset="1" stop-color="#8cfbff"/>
  </linearGradient>
  <linearGradient id="hSheen" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff" stop-opacity=".57"/><stop offset=".2" stop-color="#fff" stop-opacity=".13"/><stop offset=".54" stop-color="#fff" stop-opacity="0"/><stop offset=".85" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2=".8" y2="1">
    <stop stop-color="#f4ffff"/><stop offset=".42" stop-color="#adf5ff"/><stop offset="1" stop-color="#4bbced"/>
  </linearGradient>
  <clipPath id="sphere"><circle cx="160" cy="157" r="144"/></clipPath>
  <filter id="texture" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".041 .049" numOctaves="5" seed="22" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values=".09 .14 .11 0 -.10 .1 .25 .40 0 -.05 .22 .39 .59 0 -.08 0 0 0 .67 0"/>
  </filter>
  <filter id="cloud" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency=".016 .031" numOctaves="4" seed="9"/>
    <feColorMatrix type="matrix" values=".2 .3 .2 0 .00 .4 .4 .5 0 .03 .5 .5 .5 0 .07 0 0 0 .46 0"/>
  </filter>
  <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
    <feDropShadow dx="1" dy="7" stdDeviation="4" flood-color="#000613" flood-opacity=".88"/>
  </filter>
</defs>
<!-- Una esfera, no una placa cuadrada -->
<circle cx="160" cy="157" r="145" fill="#0d9bff" opacity=".68" filter="url(#orbGlow)"/>
<circle cx="160" cy="157" r="144" fill="url(#planet)"/>
<g clip-path="url(#sphere)">
  <rect x="12" y="8" width="296" height="296" fill="#b6e9ff" filter="url(#texture)" opacity=".70" style="mix-blend-mode:screen"/>
  <path d="M41 102c35-53 63-61 115-69 54-8 103 19 137 64-18-7-27 17-63 9-32-9-30-1-46 14-29 27-31 12-52 5-16-5-25 13-42 3C70 115 55 115 41 102Z" fill="#6fddff" opacity=".21"/>
  <path d="M22 185c31-4 62 13 78 37 21 31 45 33 70 29 33-5 58 3 69 24-37 23-128 49-183-5-16-19-30-48-34-85Z" fill="#1b80c3" opacity=".25"/>
  <rect x="12" y="8" width="296" height="296" fill="#94e6ff" filter="url(#cloud)" opacity=".47" style="mix-blend-mode:screen"/>
  <circle cx="160" cy="157" r="144" fill="url(#polar)"/>
  <path d="M20 222c23 61 91 88 156 80 70-9 107-51 119-84" fill="none" stroke="#5ac9ff" stroke-width="1.7" opacity=".27"/>
  <path d="M28 86c56-52 137-73 222-37" fill="none" stroke="#a3efff" stroke-width="2" opacity=".12"/>
</g>
<circle cx="160" cy="157" r="144" fill="none" stroke="url(#globeRim)" stroke-width="3.5"/>
<path d="M49 54a144 144 0 0 1 220 3" stroke="#b1fbff" stroke-width="2.5" fill="none" opacity=".55" filter="url(#orbGlow)"/>
<!-- Huxcasti H: verticales asimétricas unidas por un trazo ascendente -->
<path id="mark" d="M95 70H126V144L205 97V70H233V212H205V130L126 178V212H95Z" fill="#28d7ff" opacity=".82" filter="url(#logoGlow)"/>
<path d="M95 70H126V144L205 97V70H233V212H205V130L126 178V212H95Z" fill="url(#metalH)" stroke="#a8ffff" stroke-width="1.2" stroke-linejoin="round" filter="url(#shadow)"/>
<path d="M97 71H124V146L207 97V71H231" stroke="#efffff" stroke-width="1" fill="none" opacity=".56"/>
<!-- Nombre perfectamente legible en dimensiones pequeñas -->
<text x="160" y="253" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24.5" font-weight="400" letter-spacing="5.1" textLength="247" lengthAdjust="spacingAndGlyphs" fill="#60e7ff" opacity=".75" filter="url(#logoGlow)">HUXCASTI</text>
<text x="160" y="253" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24.5" font-weight="400" letter-spacing="5.1" textLength="247" lengthAdjust="spacingAndGlyphs" fill="url(#word)">HUXCASTI</text>
<path d="M56 261H264" stroke="#2ac4f0" stroke-width="1.2" opacity=".32"/>
<circle cx="160" cy="260.5" r="2" fill="#c8ffff"/>
</svg>