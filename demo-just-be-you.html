const e=document.getElementById("records-results");

function showRecord(id){
 const p=pById(id);if(!p)return;

 +'<div class="dialog-body"><div class="record-profile"><span class="client-avatar">'+initials(p.name)+'</span><div><h3>'+p.name+'</h3><p>Desde '+dateLabel(p.created)+' · '+p.count+' sesiones registradas (ejemplo)</p></div></div>'
 +'<div class="demo-record-buttons">'+action(icon("plus")+" Añadir sesión","new-session","btn-primary")+action(icon("calendar")+" Ver todas las sesiones","all-sessions","btn-outline")+action(icon("form")+" Ver formulario","intake","btn-outline")+'</div>'
 +'<div class="demo-detail-grid"><dl class="detail-item"><dt>Teléfono</dt><dd>Omitido · demo</dd></dl><dl class="detail-item"><dt>Correo</dt><dd>No disponible</dd></dl><dl class="detail-item"><dt>Registro</dt><dd>'+dateLabel(p.created)+'</dd></dl><dl class="detail-item"><dt>Estado</dt><dd>'+badge(p)+'</dd></dl></div>'
 +'<section class="demo-record-section"><h3>Historial y observaciones</h3><div class="demo-detail-grid"><dl class="detail-item"><dt>Medicamentos</dt><dd>No se muestran datos de salud</dd></dl><dl class="detail-item"><dt>Piel y exposición solar</dt><dd>Revisión profesional</dd></dl><dl class="detail-item"><dt>Alergias</dt><dd>No se muestran datos de salud</dd></dl><dl class="detail-item"><dt>Observaciones</dt><dd>Información ficticia</dd></dl></div></section>'
 +'<section class="demo-record-section"><h3>Documentos y firma del cliente</h3><div class="consent-line">'+icon("checkdoc")+'<div><b>'+(p.status==="signed"?"Consentimiento firmado (simulado)":"Pendiente de completar y firmar")+'</b><p>En la versión real se conservan las firmas y documentos privados.</p></div></div></section>'

 if(!dialog.open)dialog.showModal();
}
function handle(actionName){
 if(actionName==="intake"||actionName==="new-record"){dialog.close();navigate("form");}
 else if(actionName==="new-session"||actionName==="all-sessions"){dialog.close();navigate("sessions");}
 else if(actionName==="pending"){dialog.close();navigate("records",{filter:"pending"});}
 else if(actionName==="trash"){dialog.close();dialog.innerHTML='<header class="dialog-head"><div><p class="eyebrow">Papelera · DEMO</p><h2>Sin expedientes eliminados</h2></div><button type="button" class="icon-btn" data-close aria-label="Cerrar">'+icon("close")+'</button></header><div class="dialog-body"><p>No hay elementos en la papelera ficticia. El sistema real permite restaurar registros o eliminarlos tras su período de retención.</p></div>';dialog.showModal();}
 else if(actionName==="next"||actionName==="previous"){step=Math.max(0,Math.min(3,step+(actionName==="next"?1:-1)));shell();}
 else if(actionName==="summary"){navigate("dashboard");}
 else if(actionName==="show-appointments"){dialog.close();dialog.innerHTML='<header class="dialog-head"><div><p class="eyebrow">Agenda · DEMO</p><h2>Programar una cita</h2></div><button type="button" class="icon-btn" data-close>'+icon("close")+'</button></header><div class="dialog-body"><p>En el sistema privado pueden programarse, modificarse y cancelarse citas. Aquí se muestran únicamente horarios ficticios.</p><div class="demo-mini-panel"><h3>Ejemplo de cita</h3><ul><li>Cliente Demo 03</li><li>Evaluación inicial</li><li>Jueves 29 de octubre, 11:30 a. m.</li></ul></div></div>';dialog.showModal();}
}
document.addEventListener("click",e=>{
 const button=e.target.closest("button");if(!button)return;
 if(button.hasAttribute("data-close")){dialog.close();return;}
 if(button.dataset.nav){dialog.close();navigate(button.dataset.nav);return;}
 if(button.dataset.record){showRecord(button.dataset.record);return;}
 if(button.dataset.action){handle(button.dataset.action);return;}
 if(button.dataset.step!==undefined){step=Number(button.dataset.step);shell();}
});
document.addEventListener("input",e=>{if(e.target.id==="record-search"){search=e.target.value;updateRecords();}});
document.addEventListener("change",e=>{if(e.target.id==="record-filter"){filter=e.target.value;updateRecords();}});
dialog.addEventListener("click",e=>{if(e.target===dialog)dialog.close();});
shell();
})();
