<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071021"><meta name="robots" content="noindex, nofollow">
<title>Huxcasti Business · Acceso</title>
<style>
:root{color-scheme:dark;--bg:#070e1c;--panel:#101d31;--card:#14243b;--line:#29415b;--text:#eff8ff;--muted:#a5bacf;--blue:#44c4ff;--green:#69ebbc;--red:#ff9ba5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#15517466,transparent 50%),var(--bg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);min-height:100svh}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--blue)}
.wrap{max-width:1060px;margin:auto;padding:24px 16px 80px}.head{display:flex;align-items:center;gap:14px;min-height:70px;margin-bottom:16px}.brand{width:54px;height:56px;object-fit:contain;filter:drop-shadow(0 0 7px #42c8fa55)}.brandcopy strong{display:block;font-weight:900;letter-spacing:.20em;font-size:16px}.brandcopy small{font-size:10px;letter-spacing:.18em;color:var(--muted)}.headend{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--blue);text-transform:uppercase;margin:12px 0 8px}
h1{font-size:clamp(25px,5vw,38px);margin:6px 0 10px;line-height:1.14}h2{font-size:19px;margin:0 0 13px}h3{font-size:16px;margin:0 0 8px}p{color:var(--muted);line-height:1.55}.muted{color:var(--muted)}.small{font-size:12px}.card{border:1px solid var(--line);background:linear-gradient(155deg,#15243b,#0d192c);border-radius:19px;padding:20px;margin:14px 0;box-shadow:0 14px 35px #0002}
.auth{max-width:490px;margin:35px auto}.auth .btn.primary-submit{display:flex;width:100%;min-height:52px;margin-top:20px;position:relative;z-index:1;background:linear-gradient(120deg,#0899f5,#5fe2ff);color:#00182b;font-size:16px;font-weight:900;box-shadow:0 5px 22px #0088ff33}.auth .btn.primary-submit:active{transform:scale(.99)}.auth #authFeedback{margin-top:12px}.notice{border:1px solid #316480;background:#0e344d;border-radius:12px;color:#d8f4ff;font-size:13px;line-height:1.5;padding:12px 14px;margin:12px 0}.warn{border-color:#725448;background:#332822;color:#f0dacc}
label{display:block;font-size:12px;color:#cbdcf0;font-weight:700;margin:15px 0 7px}input,textarea,select{display:block;width:100%;border:1px solid #3b526c;color:var(--text);background:#08182a;border-radius:12px;padding:13px;outline:none;min-height:45px}textarea{min-height:120px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 2px #44c4ff22}
.btn{touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(120deg,#0785dc,#42baf1);color:#041625;border:0;border-radius:12px;padding:13px 18px;font-size:14px;font-weight:850;min-height:44px}.btn.alt{background:#172d47;color:#ccecff;border:1px solid #386082}.btn.ghost{background:none;border:1px solid #385372;color:var(--blue)}.btn.slim{padding:9px 13px;min-height:37px;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row .btn{flex:1}.actions{margin-top:18px}.selectRow{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.selectRow select{max-width:350px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:18px 0}.stat{border:1px solid var(--line);background:#142840;border-radius:14px;padding:15px}.stat b{font-size:27px;display:block;color:var(--green)}.stat span{font-size:11px;color:var(--muted)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button{padding:10px 13px;background:#101e30;border:1px solid #2d4964;color:#cbdcef;border-radius:12px}.nav button.active{border-color:#43bffc;color:#44c4ff;background:#113651}
.item{display:block;width:100%;border:1px solid #2d4560;background:#0e1d31;border-radius:13px;color:var(--text);text-align:left;padding:15px;margin:8px 0}.item strong{display:block;font-size:15px}.item span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.item:hover{border-color:var(--blue)}
.tag{border:1px solid #365979;border-radius:100px;padding:5px 10px;font-size:11px;color:#c4e6f8}.tag.green{border-color:#317960;color:#8cecc8}.message{border-radius:12px;padding:12px 14px;margin:10px 0;border:1px solid #41617c;background:#18334b;color:#e2f6ff}.message.error{background:#4b2632;border-color:#954c57;color:#ffe6e9}
.topline{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.empty{padding:35px 14px;text-align:center;color:var(--muted);border:1px dashed #2f4966;border-radius:16px}
.loader{text-align:center;padding:80px 15px;color:var(--muted)}.footer{font-size:11px;color:#8199ae;margin-top:28px}.danger{color:var(--red)}
@media(max-width:620px){.wrap{padding:12px 13px 45px}.head{gap:9px}.brand{width:45px;height:47px}.brandcopy strong{font-size:13px;letter-spacing:.13em}.brandcopy small{font-size:9px}.card{padding:17px 15px}.stats{grid-template-columns:1fr 1fr}.row .btn{flex:unset}.auth{margin:12px auto}}
</style></head><body>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm";
const URL="https://yiajjwngjoucbtkqlwhn.supabase.co";
const PUB="sb_publishable_i2-UaC_RLVyUm0lhmsuUFQ_3p_fzfdL";
const supabase=createClient(URL,PUB,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true,storageKey:"huxcasti-business-web-auth-v1"}});
window.__businessLoaded=true;
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));
const state={user:null,session:null,mode:"login",loading:false,reset:false,businesses:[],activeId:null,clients:[],notes:[],clientId:null,section:"dashboard",role:"",master:false,overview:null};
function flash(msg,error=false){const local=$("authFeedback");if(local)local.innerHTML=msg?'<div class="message '+(error?'error':'')+'" role="alert">'+esc(msg)+'</div>':'';$("flash").innerHTML=msg?'<div class="message '+(error?'error':'')+'">'+esc(msg)+'</div>':'';if(msg)setTimeout(()=>{$("flash").innerHTML=""},9500)}
function locked(v){state.loading=v;document.querySelectorAll("button").forEach(x=>x.disabled=v)}
function setMain(html){$("main").innerHTML=html;renderHead()}
function renderHead(){$("headend").innerHTML=state.user?'<span class="tag">'+esc(state.user.email)+'</span><button class="btn alt slim" id="logout">Salir</button>':'';if(state.user)$("logout").onclick=async()=>{await supabase.auth.signOut();clear();renderAuth()}}
function clear(){state.user=null;state.session=null;state.businesses=[];state.activeId=null;state.clients=[];state.notes=[];state.clientId=null;state.master=false;state.role=""}
function field(id,label,type="text",req=true){return '<label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" '+(req?'required':'')+' autocomplete="'+(id==='password'?'current-password':'on')+'>'}
function registerHandlers(){const auth=$("authForm");if(auth){auth.onsubmit=handleAuth;const submit=$("submitAuth");if(submit)submit.onclick=handleAuth;}const switcher=$("switchMode");if(switcher)switcher.onclick=()=>{state.mode=state.mode==="login"?"signup":"login";renderAuth()};const forgot=$("forgot");if(forgot)forgot.onclick=resetMail;const change=$("resetForm");if(change)change.onsubmit=changePassword;}
function renderAuth(){
 state.reset=false;
 const signup=state.mode==="signup";
 setMain('<section class="card auth"><div class="eyebrow">ACCESO PRIVADO</div><h1>'+(signup?'Crear cuenta de negocio':'Entrar a Huxcasti Business')+'</h1><p>'+(signup?'Registra tu cuenta con tu correo. Cada negocio tendrá su propio espacio privado.':'Inicia sesión para consultar únicamente los negocios a los que perteneces.')+'</p><form id="authForm" novalidate>'+field('email','Correo electrónico','email')+field('password','Contraseña (mínimo 8 caracteres)','password')+'<button type="button" id="submitAuth" class="btn primary-submit">'+(signup?'Crear cuenta':'Entrar a mi cuenta')+'</button><div id="authFeedback" aria-live="polite"></div></form><div class="row actions"><button type="button" class="btn alt slim" id="switchMode">'+(signup?'Ya tengo cuenta':'Crear cuenta nueva')+'</button><button type="button" class="btn ghost slim" id="forgot">Olvidé mi contraseña</button></div><p class="small muted">La cuenta necesita correo verificado. Sin iniciar sesión no se pueden ver clientes ni expedientes.</p><div class="notice warn">Etapa de pruebas: por ahora registra solamente datos ficticios o contactos de prueba, nunca expedientes médicos ni información sensible.</div></section>');
 registerHandlers()
}
async function handleAuth(e){
 e.preventDefault();
 if(state.loading)return;
 const email=$("email")?.value.trim()||"",password=$("password")?.value||"";
 if(!email){flash("Escribe tu correo electrónico para crear la cuenta.",true);$("email")?.focus();return}
 if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)){flash("Revisa que el correo tenga un formato válido, por ejemplo nombre@correo.com.",true);$("email")?.focus();return}
 if(!password){flash("Escribe una contraseña antes de continuar.",true);$("password")?.focus();return}
 if(password.length<8){flash("La contraseña debe tener al menos 8 caracteres.",true);$("password")?.focus();return}
 flash("");
 locked(true);
 try{
  if(state.mode==="signup"){
   const {data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
   if(error)throw error;
   if(data.session)await bootstrap(data.session);
   else{state.mode="login";renderAuth();flash("Cuenta creada. Revisa tu correo, confirma el enlace y luego entra con tu contraseña.")}
  }else{
   const {data,error}=await supabase.auth.signInWithPassword({email,password});
   if(error)throw error;
   await bootstrap(data.session);
  }
 }catch(e){flash(e.message||"No se pudo completar el acceso.",true)}finally{locked(false)}
}
async function resetMail(){
 const email=$("email")?.value?.trim()||"";
 if(!email){flash("Escribe primero tu correo electrónico.",true);return}
 try{const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;flash("Si existe esa cuenta, recibirás instrucciones en tu correo.")}catch(e){flash(e.message,true)}
}
function renderPasswordRecovery(){
 setMain('<div class="card auth"><h1>Cambiar contraseña</h1><p>Elige una contraseña nueva para tu cuenta de Huxcasti Business.</p><form id="resetForm">'+field("newPassword","Nueva contraseña","password")+'<button class="btn actions" type="submit">Guardar nueva contraseña</button></form></div>');
 registerHandlers();
}
async function changePassword(e){e.preventDefault();const password=$("newPassword").value;if(password.length<8){flash("Usa al menos 8 caracteres.",true);return}
 const {error}=await supabase.auth.updateUser({password});if(error)flash(error.message,true);else{state.reset=false;flash("Contraseña cambiada correctamente.");await bootstrap((await supabase.auth.getSession()).data.session)}
}
async function bootstrap(session){
 if(!session?.user){clear();renderAuth();return}
 state.user=session.user;state.session=session;
 setMain('<div class="loader">Abriendo tu espacio privado…</div>');
 try{
  const [{data:members,error:mErr},{data:profile,error:pErr}]=await Promise.all([
   supabase.from('business_members').select('business_id,role').eq('user_id',session.user.id),
   supabase.from('profiles').select('is_platform_admin').eq('user_id',session.user.id).maybeSingle()
  ]);
  if(mErr)throw mErr;if(pErr)throw pErr;
  state.master=!!profile?.is_platform_admin;
  let businesses=[];
  if((members||[]).length){
   const ids=members.map(x=>x.business_id);
   const {data,error}=await supabase.from('businesses').select('id,name,sector,status,plan,trial_ends_at,created_at').in('id',ids);
   if(error)throw error;
   businesses=(data||[]).map(x=>({...x,role:members.find(m=>m.business_id===x.id)?.role||'employee'}));
  }
  state.businesses=businesses;
  if(!businesses.some(x=>x.id===state.activeId))state.activeId=businesses[0]?.id||null;
  if(state.activeId)await loadClients();
  else{state.clients=[];state.notes=[]}
  state.section=state.activeId?"dashboard":(state.master?"master":"onboard");
  renderApp();
 }catch(e){setMain('<div class="card"><h2>No se pudo cargar tu cuenta</h2><p>'+esc(e.message||'Inténtalo otra vez')+'</p><button id="retry" class="btn">Reintentar</button></div>');$("retry").onclick=()=>bootstrap(session)}
}
function active(){return state.businesses.find(x=>x.id===state.activeId)}
function editable(){return ["owner","admin"].includes(active()?.role||"")}
async function loadClients(){
 if(!state.activeId)return;
 const {data,error}=await supabase.from('clients').select('id,business_id,name,phone,email,created_at').eq('business_id',state.activeId).order('created_at',{ascending:false}).limit(300);
 if(error)throw error;
 state.clients=data||[];
}
async function loadNotes(id){
 const {data,error}=await supabase.from('client_notes').select('id,client_id,business_id,content,created_at').eq('business_id',state.activeId).eq('client_id',id).order('created_at',{ascending:false}).limit(100);
 if(error)throw error;
 state.notes=data||[];
}
function navButton(key,label){return '<button data-go="'+key+'" class="'+(state.section===key?'active':'')+'">'+label+'</button>'}
function renderApp(){
 const b=active();
 let title=b?'Administración de '+esc(b.name):'Huxcasti Business';
 const select=b?'<div class="selectRow"><div><div class="eyebrow">TU ESPACIO DE TRABAJO</div><h1>'+title+'</h1><div class="row"><span class="tag">'+esc(b.sector)+'</span><span class="tag green">'+esc(b.role)+'</span><span class="tag">'+esc(b.status)+'</span></div></div>'+(state.businesses.length>1?'<select id="businessSelect" aria-label="Cambiar negocio">'+state.businesses.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===state.activeId?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>':'')+'</div>':'<div class="eyebrow">HUXCASTI BUSINESS</div><h1>Tu espacio empresarial</h1>';
 let nav='<nav class="nav">';
 if(b){nav+=navButton('dashboard','Inicio')+navButton('clients','Clientes');if(editable())nav+=navButton('addClient','Añadir cliente')}
 nav+=navButton('onboard','Registrar negocio');
 if(state.master)nav+=navButton('master','Panel maestro');
 nav+='</nav>';
 let content="";
 if(state.section==="onboard"||!b && state.section!=="master")content=onboardView();
 else if(state.section==="dashboard")content=dashboardView();
 else if(state.section==="clients")content=clientsView();
 else if(state.section==="addClient")content=addClientView();
 else if(state.section==="client")content=clientView();
 else if(state.section==="master")content=masterView();
 setMain(select+nav+content);
 document.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>{state.section=x.dataset.go;renderApp()});
 const chooser=$("businessSelect");if(chooser)chooser.onchange=async()=>{state.activeId=chooser.value;state.clientId=null;state.section="dashboard";setMain('<div class="loader">Cargando clientes…</div>');try{await loadClients();renderApp()}catch(e){flash(e.message,true)}};
 const onboard=$("onboardForm");if(onboard)onboard.onsubmit=createBusiness;
 const add=$("addClientForm");if(add)add.onsubmit=saveClient;
 const search=$("searchClient");if(search)search.oninput=()=>renderClientRows(search.value);
 document.querySelectorAll("[data-client]").forEach(x=>x.onclick=()=>openClient(x.dataset.client));
 const note=$("noteForm");if(note)note.onsubmit=saveNote;
 const back=$("backClients");if(back)back.onclick=()=>{state.section="clients";renderApp()};
 const refresh=$("refresh");if(refresh)refresh.onclick=async()=>{await loadClients();renderApp();flash("Datos actualizados.")};
 const overview=$("loadOverview");if(overview)overview.onclick=loadOverview;
}
function onboardView(){return '<article class="card"><h2>Registrar un negocio nuevo</h2><p>Este nombre será el que aparezca en su panel. Los clientes quedarán separados de los demás negocios.</p><form id="onboardForm">'+field('bname','Nombre comercial')+field('sector','Industria o actividad')+'<button class="btn actions" type="submit">Crear espacio privado</button></form><p class="small muted">Alta en prueba técnica de 14 días; no hay cobros ni tarjetas activos.</p></article>'}
async function createBusiness(e){
 e.preventDefault();const name=$("bname").value.trim(),sector=$("sector").value.trim();
 if(name.length<2){flash("Escribe el nombre del negocio.",true);return}
 locked(true);
 try{const {error}=await supabase.rpc("create_business",{p_name:name,p_sector:sector||'Otro'});if(error)throw error;await bootstrap(state.session);flash("Espacio creado correctamente.")}catch(e){flash(e.message,true)}finally{locked(false)}
}
function dashboardView(){
 const b=active();return '<div class="stats"><div class="stat"><b>'+state.clients.length+'</b><span>Clientes (primeros 300)</span></div><div class="stat"><b>'+esc(b.plan)+'</b><span>Plan técnico</span></div><div class="stat"><b>'+esc(b.status)+'</b><span>Estado</span></div></div><div class="card"><h2>Panel del negocio</h2><p>Consulta clientes y añade notas de seguimiento. Los cambios se guardan en la base de datos de Supabase, no solo en tu teléfono.</p><div class="row"><button class="btn" data-go="clients">Ver clientes</button>'+(editable()?'<button class="btn alt" data-go="addClient">Registrar cliente</button>':'')+'</div></div><div class="notice warn">La plataforma está en pruebas. No guardes expedientes de salud, datos médicos ni documentos sensibles hasta completar las pruebas y la política de privacidad.</div>'
}
function clientRows(filter=""){
 const found=state.clients.filter(x=>(x.name+" "+(x.phone||"")+" "+(x.email||"")).toLowerCase().includes(filter.trim().toLowerCase()));
 return found.length?found.map(x=>'<button class="item" data-client="'+esc(x.id)+'"><strong>'+esc(x.name)+'</strong><span>'+esc(x.phone||"Sin teléfono")+' · '+esc(x.email||"Sin correo")+'</span></button>').join(''):'<div class="empty">No se encontraron clientes.</div>';
}
function renderClientRows(value){$("clientRows").innerHTML=clientRows(value);document.querySelectorAll("[data-client]").forEach(x=>x.onclick=()=>openClient(x.dataset.client))}
function clientsView(){return '<div class="topline"><h2>Clientes registrados</h2><button class="btn alt slim" id="refresh">Actualizar</button></div><input id="searchClient" placeholder="Buscar por nombre, teléfono o correo" aria-label="Buscar clientes"><div id="clientRows">'+clientRows()+'</div>'}
function addClientView(){if(!editable())return '<p>No tienes permiso para registrar clientes.</p>';return '<div class="card"><h2>Nuevo cliente</h2><p>Registra solamente contactos de prueba por ahora.</p><form id="addClientForm">'+field('cName','Nombre completo')+field('cPhone','Teléfono','tel',false)+field('cEmail','Correo electrónico','email',false)+'<button class="btn actions" type="submit">Guardar cliente</button></form></div>'}
async function saveClient(e){
 e.preventDefault();if(!editable())return;
 const name=$("cName").value.trim(),phone=$("cPhone").value.trim(),email=$("cEmail").value.trim();
 if(name.length<2){flash("Escribe el nombre del cliente.",true);return}
 locked(true);
 try{
  const {error}=await supabase.from('clients').insert({business_id:state.activeId,name,phone:phone||null,email:email||null,created_by:state.user.id});if(error)throw error;
  await loadClients();state.section="clients";renderApp();flash("Cliente guardado en Supabase.");
 }catch(e){flash(e.message,true)}finally{locked(false)}
}
async function openClient(id){state.clientId=id;state.section="client";setMain('<div class="loader">Cargando expediente…</div>');try{await loadNotes(id);renderApp()}catch(e){flash(e.message,true);state.section="clients";renderApp()}}
function clientView(){
 const c=state.clients.find(x=>x.id===state.clientId);if(!c)return '<p>Este cliente no está disponible.</p>';
 return '<div class="card"><div class="topline"><h2>'+esc(c.name)+'</h2><button class="btn alt slim" id="backClients">Volver</button></div><p>Teléfono: '+esc(c.phone||"No disponible")+'</p><p>Correo: '+esc(c.email||"No disponible")+'</p></div><div class="card"><h2>Notas de seguimiento</h2><div id="notes">'+(state.notes.length?state.notes.map(n=>'<article class="item"><strong>'+esc(new Date(n.created_at).toLocaleDateString('es-PR'))+'</strong><span>'+esc(n.content)+'</span></article>').join(''):'<p>Aún no hay notas.</p>')+'</div>'+(editable()?'<form id="noteForm"><label for="noteText">Añadir nota (sin información médica)</label><textarea id="noteText" required minlength="1" maxlength="5000" placeholder="Escribe un seguimiento general…"></textarea><button class="btn actions" type="submit">Guardar nota</button></form>':'')+'</div>'
}
async function saveNote(e){
 e.preventDefault();if(!editable())return;const content=$("noteText").value.trim();if(!content)return;
 locked(true);
 try{const {error}=await supabase.from('client_notes').insert({business_id:state.activeId,client_id:state.clientId,content,created_by:state.user.id});if(error)throw error;await loadNotes(state.clientId);renderApp();flash("Nota guardada en Supabase.")}catch(e){flash(e.message,true)}finally{locked(false)}
}
function masterView(){
 if(!state.master)return '<div class="card">No tienes acceso al panel maestro.</div>';
 const v=state.overview;
 return '<div class="card"><h2>Panel maestro de Huxcasti</h2><p>Este panel se habilita únicamente para la cuenta que autorice el propietario de Huxcasti. Las métricas se consultan directamente en la base de datos.</p><button class="btn" id="loadOverview">Actualizar estadísticas</button></div>'+(v?'<div class="stats"><div class="stat"><b>'+v.total_businesses+'</b><span>Negocios</span></div><div class="stat"><b>'+v.active_businesses+'</b><span>Activos</span></div><div class="stat"><b>'+v.trial_businesses+'</b><span>En prueba</span></div><div class="stat"><b>'+v.total_clients+'</b><span>Clientes totales</span></div></div>':'<div class="notice">Presiona actualizar para consultar estadísticas reales. Las suscripciones aún no cobran.</div>')
}
async function loadOverview(){const {data,error}=await supabase.rpc('get_platform_overview');if(error){flash(error.message,true);return}state.overview=Array.isArray(data)?data[0]:data;renderApp()}
supabase.auth.onAuthStateChange((event,session)=>{
 if(event==="PASSWORD_RECOVERY"){state.reset=true;setTimeout(renderPasswordRecovery,0)}
 else if(event==="SIGNED_OUT"){clear();setTimeout(renderAuth,0)}
});
const check=await supabase.auth.getSession();
if(check.data?.session)await bootstrap(check.data.session);else renderAuth();
</script></body></html>
